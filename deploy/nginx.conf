# ============================================================================
# Nginx 站点配置：同时承担两个角色
#   ① 提供前端静态文件（Vue 构建产物）
#   ② 把 /api/** 反向代理到后端 Kestrel
#
# 本文件被复制到容器的 /etc/nginx/conf.d/default.conf（在 http 上下文里被 include）。
#
# ============================================================================

upstream blog_api {
    #  Docker 内置 DNS 解析
    server webapi:8080;

    # 与后端保持长连接，避免每个请求都重新握手. 每个worker进程最多保持32个空闲长连接.
    keepalive 32;
}

server {
    listen 80;

    listen [::]:80;

    server_name _;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;   # Docker 自定义网桥的默认网段。去掉服务器上的caddy
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # 上传接口允许 10 MiB（FileStorage:MaxFileSize），而 **nginx 默认上限只有 1 MiB**。
    # 不设这一行，大于 1MB 的图片会被 nginx 直接拦成 413，
    # **请求根本到不了后端**，后端日志里什么都看不到 —— 会让人误以为是前端问题。
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ────────────────────────────────────────────────────── API 反向代理
    location /api/ {
        proxy_pass http://blog_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 健康检查也走反代，便于从外部探活。响应体只有 Healthy / Unhealthy。
    location = /health {
        proxy_pass http://blog_api;
        proxy_set_header Host $host;
        # 同样用 $remote_addr 覆盖，不接受客户端提供的转发头（原因见 /api/ 段的说明）
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    # ─────────────────────────── 静态资源（文件名自带内容哈希，可长缓存）
    location /assets/ {
        # Vite 产出的是 index-<hash>.js / index-<hash>.css 这类文件名：
        # 内容一变文件名就变，所以可以放心缓存一年。
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 重复父级安全头（原因见上方 add_header 陷阱说明）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        try_files $uri =404;
    }

    # ─── index.html 必须**不缓存** ──────────────────────────────────────
    # 它引用的是 /assets/index-<hash>.js，每次构建哈希都会变。
    # 一旦 index.html 被缓存，用户会一直加载**旧版本前端**，
    # 而旧前端可能调用已经改过的 API —— 表现为"我明明发了新版，用户还是报错"。
    location = /index.html {
        expires -1;
        # add_header Cache-Control "no-cache"; # 这两条都可以，nginx 官方文档里说 no-cache 是 -1 的别名。

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # ─────────────────────────────────────── SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
