# ============================================================================
# CI：每次 push / PR 都用一台**干净的 Linux 机器**重跑全部验证
#
#
# 六个作业，是一条链：
#
#   先并行跑四个检查：
#     hygiene   行尾检查（最快，秒级失败）
#     frontend  类型检查 + 构建
#     backend   格式检查 + 编译 + 全部测试（含需要真实 PostgreSQL 的集成测试）+ 覆盖率
#     security  依赖漏洞扫描（NuGet + npm，**只报告不阻断** —— 所以它不在这条链上）
#
#   然后（仅在「合并进 main、或推送 v* 版本 tag」时）依次：
#     publish   三个检查全绿 → 构建并推送应用镜像到 GHCR
#     deploy    publish 成功 → 同步 compose / 部署脚本 → SSH 更新服务器 → 从公网核对版本
#
# 也就是说：**合并进 main 就是上线**（tag 只是额外的「正式发布」标记）。
# 首次部署不在这里（服务器上还没有 compose 与 .env），仍走本地打包，见 tools/deploy/README.md
# ============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # 允许在 Actions 页面手动触发，**只跑四个检查作业**：不推镜像、不部署。
  # 理由：手动触发时 ref 可以是任意分支，让它发布或部署等于"把功能分支发到生产"。
  workflow_dispatch:

# 同一分支上新的推送会取消仍在跑的旧运行，避免排队浪费时间与额度。
#
# ⚠️ 但**只对 PR 取消**：main 与 v* tag 的推送后面跟着 deploy 作业，
#    取消一个正在部署的运行会把线上留在半更新状态（且新旧两次部署会互相抢）。
#    这两种 ref 改为排队 —— 排队最坏是多等一轮，取消无法撤销。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 全局环境变量。
# 注意：这里**没有任何密钥**，也不需要密钥 ——
# 集成测试夹具会强制 UseEnvironment("Development")，
# 因此读到的是 appsettings.Development.json 里的开发签名密钥。
# 密钥注入是 CD（部署）阶段才需要的事。
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # 作业一：卫生检查 —— 最快，期望它最先失败
  # ══════════════════════════════════════════════════════════════════════
  hygiene:
    name: 卫生检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: 检查行尾是否被写成 CRLF
        run: |
          if git ls-files --eol | grep -q 'w/crlf'; then
            echo "::error::检测到 CRLF 行尾，请检查编辑器设置（见 docs/05 §7.2）"
            echo "--- 受影响文件 ---"
            git ls-files --eol | grep 'w/crlf'
            exit 1
          fi
          echo "OK：未发现 CRLF 行尾"

  # ══════════════════════════════════════════════════════════════════════
  # 作业二：前端
  # ══════════════════════════════════════════════════════════════════════
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Blog.FrontEnd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # 内置缓存：按 package-lock.json 的哈希做缓存键
          cache: npm
          cache-dependency-path: Blog.FrontEnd/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx vue-tsc -b --force

      - name: 构建
        run: npx vite build

  # ══════════════════════════════════════════════════════════════════════
  # 作业三：后端（编译 + 全部后端测试）
  # ══════════════════════════════════════════════════════════════════════
  backend:
    name: 后端（构建 + 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # NuGet 缓存：CI 里 restore 通常是最大的时间开销。
      # 缓存键用 csproj 的哈希 —— 依赖清单没变就命中缓存，变了自动换新。
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── 起数据库 ────────────────────────────────────────────────────
      #
      # services: 官方提供的镜像服务.
      # 为什么用 `docker run` 而不是 `services:` ？
      #   集成测试需要 **zhparser 扩展**（Posts.SearchVector 是生成列，
      #      表达式用了 to_tsvector('chinese', ...)），而官方镜像里没有它。

      - name: 拉取带 zhparser 的 PostgreSQL 镜像
        run: docker pull mixdeve/postgres-zhparser:18

      - name: 启动 PostgreSQL 与 Redis
        run: |
          # 凭证必须与下一步测试传给夹具的 BLOG_CONNECTION 一致。
          # 夹具的连接串解析顺序是「环境变量 → appsettings.Development.json」，
          # 所以 CI 里不依赖开发机那份配置是否恰好相同。
          docker run -d --name pgsql \
            -e POSTGRES_USER=kky \
            -e POSTGRES_PASSWORD=123456 \
            -e POSTGRES_DB=blog_stage2 \
            -p 5432:5432 \
            mixdeve/postgres-zhparser:18

          # Redis 地址仍取自 appsettings.Development.json（localhost:6379），夹具会把它
          # 换成一个随机 db index 做跨运行隔离。
          # 限流桶也在这里，但测试夹具已把它关掉（RateLimit:Enabled=false）。
          docker run -d --name redis -p 6379:6379 redis:7.4.11-alpine

      - name: 等待 PostgreSQL 就绪
        run: |
          #「容器启动了」!=「数据库能连了」。
          for i in $(seq 1 60); do
            if docker exec pgsql pg_isready -U kky -d blog_stage2 >/dev/null 2>&1; then
              echo "PostgreSQL 就绪（等待 $((i * 2)) 秒）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL 未在 120 秒内就绪"
          docker logs pgsql
          exit 1

      # 先单独验证分词可用，再跑测试。
      #
      # 这一步**只**证明「扩展在、配置能跑起来」，**不**证明映射完整。
      # 镜像自带的 entrypoint 脚本建出的 `chinese` 只映射 n,v,a,i,e,l，
      # 缺 j,q —— 缺的映射由 EF 迁移补齐，所以映射完整性由测试之后那一步守。
      - name: 校验 zhparser 与中文分词配置可用
        run: |
          docker exec pgsql psql -U kky -d blog_stage2 -tAc \
            "SELECT extname FROM pg_extension WHERE extname='zhparser';" | grep -q zhparser
          docker exec pgsql psql -U kky -d blog_stage2 -tAc \
            "SELECT to_tsvector('chinese','使用 EF Core 做数据库优化与全文检索');"
          echo "OK：zhparser 扩展与 chinese 检索配置可用"

      # ── 编译与测试 ──────────────────────────────────────────────────
      - name: 还原依赖
        run: dotnet restore Blog.Backend/Blog.Backend.slnx

      - name: 检查 C# 格式（.editorconfig）
        run: |
          dotnet format Blog.Backend/Blog.Backend.slnx whitespace --verify-no-changes --no-restore \
            || { echo "::error::C# 格式不符合 .editorconfig。本地执行：dotnet format Blog.Backend/Blog.Backend.slnx whitespace"; exit 1; }
          echo "OK：C# 格式符合 .editorconfig"

      - name: 编译（Release）
        run: dotnet build Blog.Backend/Blog.Backend.slnx --no-restore --configuration Release

      # 跑全部测试（单元 + 集成 + 契约测试）。
      #
      # ⚠️ 用 --settings 而不是 --collect：
      #    排除规则（EF 迁移、源生成代码）写在 coverage.runsettings 里，
      #    而排除**只能**通过 runsettings 传。不排除的话数字是没有意义的 ——
      #    实测未排除时 Blog.Infrastructure 显示 91.8%，其中 73% 的行数是 EF 生成的迁移。
      #    两者同时给会重复挂载收集器，所以这里只留 --settings。

      - name: 跑测试并收集覆盖率
        env:
          # 集成测试夹具优先读这个变量（回退到 appsettings.Development.json）。
          # 与设计期工厂 BlogDbContextFactory 同名同义：一个变量决定「这次运行连哪个 PG」，
          # 于是 CI 不再依赖"开发机上那份配置文件恰好长这样"。
          BLOG_CONNECTION: "Host=localhost;Port=5432;Database=blog_stage2;Username=kky;Password=123456;"
        run: >
          dotnet test Blog.Backend/Blog.Tests/Blog.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --settings Blog.Backend/coverage.runsettings

      # ⚠️ 这一步是必须的，不是可选的：集成测试**不会**迁移 blog_stage2。
      #
      # 测试夹具 BlogApiFactory 每次运行都新建一个随机库
      # （`blog_stage2_test_<guid>`），迁移跑在**那个库**上，结束时整库删掉。
      # 所以 CI 里的 blog_stage2 始终停留在「镜像 entrypoint 脚本刚建好」的状态：
      #   - 有 chinese 配置，但只有 n,v,a,i,e,l, 缺 j,q, 因为测试阶段不会迁移，迁移还没跑
      #
      # 于是想校验「迁移把映射补全了」，就必须**真的把迁移跑在这个库上**。
      # 这同时也补上了一个覆盖缺口：验证迁移链能在「库已存在 + 半配置」的库上从零建表建配置 —— 那正是线上首次启动的形态。
      #
      # 走 BLOG_CONNECTION 是因为 BlogDbContextFactory（设计期工厂）读这个环境变量，
      # 这样不必依赖 Program.cs 的启动配置（那条路要 Jwt:SigningKey 等一堆生产校验）。
      - name: 在半配置的 blog_stage2 上跑完整迁移链
        env:
          BLOG_CONNECTION: "Host=localhost;Port=5432;Database=blog_stage2;Username=kky;Password=123456;"
        working-directory: Blog.Backend
        run: |
          # 还原dotnet tool工具（这里是dotnet ef）
          dotnet tool restore
          dotnet ef database update \
            --project Blog.Infrastructure \
            --startup-project Blog.WebApi

          # 断言**真的迁移了**。
          count=$(docker exec pgsql psql -U kky -d blog_stage2 -tAc \
            "SELECT count(*) FROM \"__EFMigrationsHistory\";" | tr -d '[:space:]')
          echo "已应用迁移：${count} 条"
          [ "$count" -ge 5 ] || { echo "::error::迁移没有全部应用（实际 ${count} 条）"; exit 1; }

      # 测试 `chinese` 检索配置的 token 映射必须**完整**。
      #
      # 实测：社区镜像自带脚本建出的配置只有 n,v,a,i,e,l；
      #   缺 j(简称) q(量词) 时，`一篇文章` 的 `篇` 根本不在索引里。
      #   迁移 20260918174440_EnsureChineseConfigTokenMappings 负责补齐。
      #
      - name: 校验 chinese 检索配置的映射完整（防静默缺项）
        run: |
          actual=$(docker exec pgsql psql -U kky -d blog_stage2 -tAc \
            "SELECT string_agg(DISTINCT t.alias, ',' ORDER BY t.alias)
               FROM pg_ts_config c
               JOIN pg_ts_config_map m ON m.mapcfg = c.oid
               JOIN ts_token_type(c.cfgparser) t ON t.tokid = m.maptokentype
              WHERE c.cfgname = 'chinese';" | tr -d '[:space:]')
          echo "chinese 映射：${actual}"
          if [ "$actual" != "a,e,i,j,l,n,q,v" ]; then
            echo "::error::chinese 检索配置的映射不完整（实际 '${actual}'，期望 'a,e,i,j,l,n,q,v'）。缺项的 token 会被静默丢弃、不进检索索引。"
            exit 1
          fi
          # 端到端再确认一次：迁移补齐后，量词确实进了索引
          docker exec pgsql psql -U kky -d blog_stage2 -tAc \
            "SELECT to_tsvector('chinese','一篇文章五个参数');" | grep -q "'篇'"
          echo "OK：映射完整，且量词已进入索引"

      #    `dotnet test` 在一个测试都没发现或者一些配置错误时，也会返回退出码 0 正常退出。
      #    也就是说：路径写错、过滤器写错、测试工程没被编译进产物……
      #    这些情况都会让流水线**变绿**，而实际上什么都没验证。
      #
      #    这里显式解析 trx 报告，把"测试真的跑了"变成硬性检查。
      - name: 校验测试确实被执行（防假绿）
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = glob.glob('**/TestResults/**/*.trx', recursive=True)
          if not files:
              print('::error::没有找到 trx 测试报告，无法确认测试是否执行')
              sys.exit(1)

          total = passed = failed = 0
          for f in files:
              root = ET.parse(f).getroot()
              ns = {'t': root.tag.split('}')[0].strip('{')}
              c = root.find('.//t:ResultSummary/t:Counters', ns)
              if c is None:
                  continue
              total  += int(c.get('total', 0))
              passed += int(c.get('passed', 0))
              failed += int(c.get('failed', 0))

          print(f'测试总数 {total}：通过 {passed}，失败 {failed}')

          # 写进 GitHub 的「作业摘要」——这样在 Actions 页面**不下载制品**就能看到数字，
          # 也方便截图留证（简历/面试时"跑了多少测试"是要能被看到的）。
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write(
                      '## 后端测试结果\n\n'
                      '| 指标 | 数量 |\n|---|---:|\n'
                      f'| 总计 | {total} |\n'
                      f'| 通过 | {passed} |\n'
                      f'| 失败 | {failed} |\n'
                  )

          if total == 0:
              print('::error::执行了 0 个测试 —— 这几乎总是"测试没被发现"，属于假绿')
              sys.exit(1)
          if failed:
              print(f'::error::有 {failed} 个测试失败')
              sys.exit(1)
          PY

      - name: 覆盖率写进作业摘要（并确认报告真的产出了）
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = glob.glob('**/TestResults/**/coverage.cobertura.xml', recursive=True)
          if not files:
              print('::error::没有产出 coverage.cobertura.xml —— 覆盖率收集没有生效。')
              print('::error::最常见的原因：--settings Blog.Backend/coverage.runsettings 丢失，')
              print('::error::或该文件被删除/改名。流水线不会因此变红，所以在这里显式兜住。')
              sys.exit(1)

          root = ET.parse(files[0]).getroot()
          line_rate = float(root.get('line-rate', 0)) * 100
          branch_rate = float(root.get('branch-rate', 0)) * 100
          covered = root.get('lines-covered')
          valid = root.get('lines-valid')
          print(f'行覆盖 {line_rate:.1f}%（{covered}/{valid}）  分支覆盖 {branch_rate:.1f}%')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write(
                      '## 覆盖率（仅供观察，不设阈值）\n\n'
                      '| 指标 | 数值 |\n|---|---:|\n'
                      f'| 行覆盖 | {line_rate:.1f}% ({covered}/{valid}) |\n'
                      f'| 分支覆盖 | {branch_rate:.1f}% |\n\n'
                      '> 已排除 EF 迁移与源生成代码（`coverage.runsettings`）。\n'
                      '> **不对总量设阈值**——阈值只会逼人写不 assert 的测试来凑数（learn/02 §4.2）。\n'
                  )
          PY

      # 无论成功失败都上传。
      # 只在成功时上传，等于"失败时什么都没有"—— 而失败时恰恰最需要报告。
      - name: 上传测试报告与覆盖率
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: "**/TestResults/**"
          if-no-files-found: warn

      # 集成测试失败时，最需要的信息在**数据库容器**里，而不在测试输出里
      - name: 失败时输出数据库日志
        if: failure()
        run: docker logs pgsql

  # ══════════════════════════════════════════════════════════════════════
  # 作业四：依赖安全扫描
  #
  # 只报告不阻断（continue-on-error）
  #
  # ⚠️ 一个容易被忽略的事实（实测于 2026-09-13）：
  #   **这个项目其实早就在扫依赖漏洞了。** NuGet Audit 从 .NET 8 SDK 起默认开启，
  #   `dotnet restore` / `dotnet build` 会打出 NU1903 警告。CI 每次都在打这个警告 ——
  #   只是它是**警告**：不会让流水线变红，也不会有任何人看见。
  # ══════════════════════════════════════════════════════════════════════
  security:
    name: 依赖安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # dotnet list package 需要先有还原结果（obj/project.assets.json），
      # 否则它拿不到依赖树。所以这里不能省掉 restore。
      - name: 还原依赖
        run: dotnet restore Blog.Backend/Blog.Backend.slnx

      # --include-transitive 才是重点：漏洞通常藏在**传递依赖**里，只扫直接依赖会漏掉大部分情况
      #
      # 输出同时写进文件，后面那一步要把它搬进作业摘要 ——
      # 一个"只在日志深处"的检查等于没有。
      - name: NuGet 漏洞扫描（含传递依赖）
        continue-on-error: true
        run: |
          set -o pipefail
          if ! dotnet list Blog.Backend/Blog.Backend.slnx package \
                 --vulnerable --include-transitive 2>&1 | tee "$RUNNER_TEMP/nuget-vuln.txt"; then
            echo "::error::NuGet 漏洞扫描命令本身失败了（还原未完成？网络不通？）"
            echo "::error::⚠️ 不要把这种情况当成「没有漏洞」—— 这是一次「不知道」（见 archive/问题排查记录.md §8）"
            exit 1
          fi

          # 无论"扫出漏洞"还是"干净"，正常输出里都会出现 vulnerable / 易受攻击 字样
          # （前者："has the following vulnerable packages"，后者："has no vulnerable packages"）。
          # 两样都没有 → 说明命令没真正执行，而不是"没有漏洞"。
          if ! grep -qiE 'vulnerab|易受攻击' "$RUNNER_TEMP/nuget-vuln.txt"; then
            echo "::error::扫描输出里没有出现漏洞相关的任何字样，无法确认扫描真的执行了"
            exit 1
          fi

      - name: npm 漏洞扫描
        continue-on-error: true
        run: |
          cd Blog.FrontEnd
          npm audit --registry=https://registry.npmjs.org 2>&1 | tee "$RUNNER_TEMP/npm-audit.txt" || true

          # npm audit 正常时一定打印 "found N vulnerabilities"（N 可以是 0）。
          # 没有这行 → 审计没执行，而不是"没有漏洞"。
          if ! grep -qiE 'vulnerabilit' "$RUNNER_TEMP/npm-audit.txt"; then
            echo "::error::npm audit 没有产出可识别的结论 —— 扫描很可能根本没执行（见 archive/问题排查记录.md §8）"
            echo "::error::⚠️ 不要把它当成「没有漏洞」"
            exit 1
          fi

      # 无论扫描成功失败都写摘要（失败的那次恰恰最需要看）。
      - name: 把扫描结果写进作业摘要
        if: always()
        run: |
          {
            echo '## 依赖安全扫描（只报告，不阻断）'
            echo
            echo '发现高危漏洞时**这里会列出**，但不会卡住合并 —— 先观察一段时间再决定是否设成门禁。'
            echo
            echo '### NuGet（含传递依赖）'
            echo '```'
            cat "$RUNNER_TEMP/nuget-vuln.txt" 2>/dev/null || echo '(没有产出，可能是扫描步骤本身失败了)'
            echo '```'
            echo '### npm'
            echo '```'
            cat "$RUNNER_TEMP/npm-audit.txt" 2>/dev/null || echo '(没有产出，可能是扫描步骤本身失败了)'
            echo '```'
            echo '> ⚠️ `SixLabors.ImageSharp` 刻意锁在 3.x（v4 起需构建期许可密钥）。'
            echo '> 因此这条扫描的结论里如果出现它，要看清楚"修复版本"是不是 4.x —— 是的话不能升，需要单独决策。'
          } >> "$GITHUB_STEP_SUMMARY"

  # ══════════════════════════════════════════════════════════════════════
  # 作业五：把应用镜像推到 GHCR —— **合并进 main、或推 v* tag 时才跑**
  #
  # Docker 按**层**拉取，改后端时通常只有应用那一层变（几 MB），而不是整个镜像。
  # 本地打包那条路仍然保留（`tools/deploy/deploy.sh build`）—— **首次部署仍然用它**
  # （PG 镜像约 157 MB，没必要每次让 CI 重建重推）。
  #
  # ⚠️ 它 `needs` 三个检查作业：镜像一推上去就是"可部署的制品"，
  #    测试红着推出去的镜像没有任何价值，只会在 GHCR 里留下一个永远不该部署的 sha。
  # ══════════════════════════════════════════════════════════════════════
  publish:
    name: 发布镜像到 GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 不含 security —— 它按设计只报告不阻断
    needs: [hygiene, frontend, backend]
    # PR 里不推：会把 registry 塞满永远不会合并的版本。
    # 版本 tag 推送同样要进这里 —— 那正是「发布」动作。
    # ⚠️ 手动触发**不在**这里：它的 ref 可以是任意分支，推出去就等于一个来路不明的制品。
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ────────────────────────────────────────────────────────────────
      # 版本号解析：把「这次构建是什么版本」算成环境变量，供后面注入镜像。
      #
      # 两种情况：
      #   tag 推送        -> VERSION = tag 名（如 v2026.09.17），并更新 :latest
      #   main 分支推送   -> VERSION = v0.0.0-main.<短sha>，**不动** :latest
      #
      # 为什么 main 分支不更新 :latest：
      #   `latest` 只有在「打 tag 发布」时才移动，它才等于「最新正式版」这个可靠含义。
      #   否则它只是一个会飘的别名，说不清线上跑的是哪一版（docs/05 §8.9）。
      #   日常上 main 的构建仍可用不可变的 :<sha> 部署，能力没有任何损失。
      # ────────────────────────────────────────────────────────────────
      - name: 解析版本号
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v0.0.0-main.${SHORT_SHA}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          # 构建时间取此刻（UTC ISO 8601）。不要用 github.event.repository.updated_at ——
          # 那是仓库设置被改的时间，与本次构建毫无关系。
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "解析结果：VERSION=${VERSION}"

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag 由 metadata-action 统一生成，而不是手写 `tags:` 多行字符串。

      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-webapi
          # latest=auto：推版本 tag 时才把 :latest 指过去；
          # 日常 main 分支构建**不动** :latest，它才等于「最新正式版」这个可靠含义。
          flavor: latest=auto
          tags: |
            # 裸 sha：服务器上就是拿 `:<sha>` 去 pull 的。
            type=raw,value=${{ github.sha }}
            # 人读的版本号：tag 推送时用 tag 名，否则用 v0.0.0-main.<短sha>
            type=raw,value=${{ steps.version.outputs.version }}
            # 只有打 tag 发布才移动 :latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=blog-webapi
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # build-args 把版本/SHA/构建时间注入镜像：runtime 阶段会写进 /app/version，
      # 应用启动时读成环境变量，由 GET /api/version 返回。
      # 没有这一步，「线上跑的是哪一版」就还得靠 docker inspect 反推。
      - name: 构建并推送 webapi
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/webapi.Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.version.outputs.built_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # scope 要分开：两个镜像共用一份 gha 缓存会互相冲掉
          cache-from: type=gha,scope=webapi
          cache-to: type=gha,mode=max,scope=webapi

      # nginx 用同一套 tag 规则（同一个版本号 / 同一个 sha / 同样只在发布时移动 latest），
      # 这样「前后端同版本」是一个可以直接观察的事实，不用两边分别对。
      - name: 生成 nginx 镜像 tag
        id: meta-nginx
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-nginx
          flavor: latest=auto
          tags: |
            # 裸 sha：服务器上就是拿 `:<sha>` 去 pull 的。
            # 与 webapi 完全同一套规则（裸 sha，不是 type=sha 的 sha- 前缀形式）——
            # 两个镜像的 tag 必须一致，否则 deploy.sh update 一次要拉两个，
            # 其中一个形式不对就整个失败（线上实测踩过）
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=blog-nginx
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: 构建并推送 nginx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/nginx.Dockerfile
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: 把镜像地址写进作业摘要
        run: |
          {
            echo '## 已发布镜像到 GHCR'
            echo
            echo "**版本号**：\`${{ steps.version.outputs.version }}\`　"
            echo "**提交**：\`${{ github.sha }}\`　"
            echo "**构建时间**：\`${{ steps.version.outputs.built_at }}\`"
            echo
            echo '| 镜像 | tag（不可变，回滚就用它） | 版本号 tag（人读） |'
            echo '|---|---|---|'
            echo "| webapi | \`ghcr.io/${{ github.repository }}-webapi:${{ github.sha }}\` | \`:${{ steps.version.outputs.version }}\` |"
            echo "| nginx  | \`ghcr.io/${{ github.repository }}-nginx:${{ github.sha }}\` | \`:${{ steps.version.outputs.version }}\` |"
            echo
            if [[ '${{ startsWith(github.ref, 'refs/tags/v') }}' == 'true' ]]; then
              echo '> 🏷️ 这是一次**版本发布**：`:latest` 已指向本版本。'
            else
              echo '> ℹ️ 这是 main 分支的日常构建，**没有移动 `:latest`** ——'
              echo '> `:latest` 只在打版本 tag 时更新，这样它才等于"最新正式版"。'
            fi
            echo
            echo '### 服务器更新'
            echo '✅ 这是 main / v* tag 的推送：`deploy` 作业会自动执行服务器上的'
            echo "\`bash tools/deploy/deploy.sh update ${{ github.sha }}\`（目录 /opt/blog），"
            echo '并在部署后**从公网**确认线上真的报出这个 sha。'
            echo '> 用 **sha**（不可变），不要用 `:latest`。'
            echo '> 手工核对：`curl -s https://<站点>/api/version`。'
          } >> "$GITHUB_STEP_SUMMARY"

  # ══════════════════════════════════════════════════════════════════════
  # 作业六：SSH 到服务器执行部署 —— **合并进 main 或推 v* tag 时都跑**
  #
  # 也就是说「CI 绿 → 线上就是它」这条链路是自动的：没有人工点部署这一步。
  # 代价要清楚：任何一个**测试全绿但行为不对**的改动，合并进 main 就会立刻上线。
  #
  # 首次部署不在这里（服务器上还没有 compose / .env），见 tools/deploy/README.md §2。
  # ══════════════════════════════════════════════════════════════════════
  deploy:
    name: 自动部署到服务器
    runs-on: ubuntu-latest

    # ⚠️ 这条依赖是**安全前提**，不是保险：`publish` 自己 needs 三个检查作业，
    #    所以「检查全绿 → 推镜像 → 部署」是一条链。
    #    谁把 publish 的 needs 拿掉，这里就跟着一起失守 —— 改那边时必须回来看这一行。
    #    （不含 security —— 它按设计只报告不阻断。）
    needs: [publish]

    # ⚠️ 这里**刻意没有** workflow_dispatch：手动触发的 ref 可以是任意分支，
    #    于是"手动跑一次 CI"= "把功能分支发到生产"。
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    # 一次只跑一个部署：两次并发的 update 会互相抢，先启动的那次若最后完成，
    # 线上就被退回旧 sha（且它同样是"成功"的，不会有人注意到）。
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    timeout-minutes: 15

    steps:
      # 需要仓库里的文件：下一步要把 compose 与部署脚本同步到服务器
      - uses: actions/checkout@v7

      # ⚠️ GHCR 里只有 webapi / nginx 两个镜像，compose 文件与 deploy.sh 都不在里面。
      #    以前它们靠人 scp，于是"改了脚本但服务器那份没换"是一种**不报错**的故障
      #    （镜像换了、行为没换）。改成每次部署前同步一次 —— 部署用的永远是这次提交里的那份。
      #
      # ⚠️ 绝不设置 `rm`：那会把服务器上的 .env 一起删掉（它不在仓库里，删了只能重新生成密钥）。
      #    `source` 保持相对路径，scp-action 会按原目录结构落到 /opt/blog/tools/deploy/deploy.sh。
      - name: 同步 compose 与部署脚本到服务器
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 可选加固：填了这个 secret 就校验服务器主机密钥（防中间人）；
          # 不填则退回"不校验"。取值方法见 docs/05 §8.7.2
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: "docker-compose.yml,docker-compose.prod.yml,tools/deploy/deploy.sh"
          target: /opt/blog/
          overwrite: true

      - name: SSH 到服务器并执行部署脚本
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          script: |
            cd /opt/blog
            bash tools/deploy/deploy.sh update ${{ github.sha }}

      # ⚠️ 「SSH 命令退出码 0」不等于「公网真的在跑这一版」：
      #    Caddy / nginx / 应用缓存任何一层没换，上一步都看不出来。
      #    这是失效哨兵 —— 必须**看到线上报出这次的 sha**才算部署成功（learn/02 §4）。
      - name: 校验线上真的在跑这次提交（防假绿）
        env:
          # 站点地址可以用仓库变量 SITE_URL 覆盖；没设就用线上域名
          SITE_URL: ${{ vars.SITE_URL || 'https://www.kkynet.site' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          short="${EXPECTED_SHA:0:7}"
          for i in $(seq 1 10); do
            body="$(curl -fsS --max-time 10 "$SITE_URL/api/version" 2>/dev/null || true)"
            echo "第 $i 次：${body:-（取不到）}"
            if printf '%s' "$body" | grep -q "$short"; then
              echo "OK：线上已切换到 $short"
              exit 0
            fi
            sleep 6
          done
          echo "::error::部署后 60 秒内 $SITE_URL/api/version 仍未报出 $short —— 不要当成部署成功"
          echo "::error::排查顺序：curl $SITE_URL/health → 服务器上 bash tools/deploy/deploy.sh status"
          exit 1
